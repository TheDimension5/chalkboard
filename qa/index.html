<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B2923">
<link rel="manifest" href="https://thedimension5.github.io/chalkboard/manifest.json">
<link rel="apple-touch-icon" href="https://thedimension5.github.io/chalkboard/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chalkboard">
<meta charset="utf-8">
<title>Chalkboard Self-Test</title>
<meta name="description" content="Loads every board, drives every simulation for ten seconds, and reports what painted, what errored, and whether the missions engine is alive.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;700;900&display=swap">
<style>
:root{
  --board:#1B2923;--board-2:#1F2F28;--board-3:#2A3B33;
  --chalk:#F1ECDF;--chalk-dim:rgba(241,236,223,.66);--chalk-faint:rgba(241,236,223,.32);--chalk-line:rgba(241,236,223,.15);
  --yellow:#F6D46B;--blue:#8CC4EE;--pink:#F596A8;--green:#9DDBA3;
  --tray:#5C3D27;--tray-2:#3B2718;
  --display:'Caveat','Segoe Print','Bradley Hand',cursive;
  --body:'Nunito','Avenir Next','Segoe UI',system-ui,sans-serif;
  --maxw:1180px;
}
*{box-sizing:border-box}
html{color-scheme:dark;scroll-behavior:smooth}
body{margin:0;background:var(--board);color:var(--chalk);font-family:var(--body);font-size:1.0625rem;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body{background-color:var(--board);background-image:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='240'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.09'/%3E%3C/svg%3E"),radial-gradient(ellipse at 12% 0%,rgba(255,255,255,.05),transparent 50%),radial-gradient(ellipse at 92% 100%,rgba(255,255,255,.045),transparent 50%),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.28));background-attachment:scroll,fixed,fixed,fixed;background-size:240px 240px,auto,auto,auto;background-repeat:repeat,no-repeat,no-repeat,no-repeat}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(1rem,4vw,2.5rem);position:relative;z-index:1}
.skip{position:absolute;left:-999px;top:0;background:var(--yellow);color:var(--board);padding:.5rem 1rem;z-index:10;font-weight:900}
.skip:focus{left:1rem;top:1rem}

h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.02;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(3.2rem,7.5vw,6rem)}
h2{font-size:clamp(2.3rem,4.6vw,3.5rem)}
h3{font-size:1.75rem}
p{margin:0}
a{color:var(--yellow)}
.eyebrow{font-weight:900;font-size:.76rem;letter-spacing:.15em;text-transform:uppercase;color:var(--yellow);margin-bottom:.5rem}
.eyebrow.dim{color:var(--chalk-dim)}
.lede{font-size:1.28rem;max-width:34ch;margin-top:1.1rem}
.text{max-width:60ch}
.text h2{margin-bottom:1rem}
.text p+p{margin-top:.95em}
.text em{font-style:normal;color:var(--yellow)}
.text .when{font-family:var(--display);font-size:1.45rem;color:var(--chalk-dim);margin-top:-.4rem;margin-bottom:1rem}
.chalkword{font-family:var(--display);font-size:1.25em;line-height:1;color:var(--yellow)}

.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:center;padding:clamp(2.5rem,6vw,5rem) 0 clamp(2rem,5vw,4rem)}
.hero-cta{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.4rem;margin-top:1.8rem}
.hint{font-family:var(--display);font-size:1.3rem;color:var(--chalk-dim)}
.chapter{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:clamp(1.5rem,4vw,3.5rem);align-items:start;padding:clamp(3rem,7vw,6rem) 0;border-top:1px solid var(--chalk-line);scroll-margin-top:.5rem}
.chapter.wide{grid-template-columns:1fr}
.chapter.wide .text{max-width:70ch}
@media (max-width:860px){.hero,.chapter{grid-template-columns:1fr}}

.panel{position:relative;border:2px solid var(--chalk-faint);border-radius:10px;background:rgba(0,0,0,.16);box-shadow:inset 0 0 70px rgba(0,0,0,.28);overflow:hidden}
.panel canvas{display:block;width:100%;aspect-ratio:4/3;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.panel canvas.short{aspect-ratio:16/10}
.panel .doodle{position:absolute;right:1.1rem;bottom:.6rem;font-family:var(--display);font-size:1.6rem;color:var(--chalk-faint);transform:rotate(-5deg);pointer-events:none}
.lab{margin:0;display:flex;flex-direction:column;gap:.85rem}
.controls{display:flex;flex-wrap:wrap;gap:.6rem .9rem;align-items:center}
.controls .sep{width:1px;height:1.6rem;background:var(--chalk-line)}
.btn{font:900 .88rem/1 var(--body);letter-spacing:.04em;color:var(--chalk);background:transparent;border:2px solid var(--chalk-dim);border-radius:999px;padding:.66rem 1.05rem;cursor:pointer;transition:background .15s,color .15s,transform .15s,border-color .15s}
.btn:hover{background:var(--chalk);color:var(--board);border-color:var(--chalk)}
.btn:active{transform:scale(.97)}
.btn.is-on{background:var(--yellow);color:var(--board);border-color:var(--yellow)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:var(--board);font-size:1rem;padding:.85rem 1.5rem}
.btn.primary:hover{background:var(--chalk);border-color:var(--chalk)}
.btn.blue{border-color:var(--blue);color:var(--blue)}.btn.blue:hover,.btn.blue.is-on{background:var(--blue);color:var(--board)}
.btn.pink{border-color:var(--pink);color:var(--pink)}.btn.pink:hover,.btn.pink.is-on{background:var(--pink);color:var(--board)}
.btn:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.slider{display:flex;align-items:center;gap:.6rem;font-weight:900;font-size:.85rem;letter-spacing:.03em}
.slider input{accent-color:var(--yellow);width:150px;margin:0}
.slider .val{font-family:var(--display);font-size:1.25rem;font-weight:700;min-width:3.2ch;color:var(--yellow);font-variant-numeric:tabular-nums}
figcaption{font-size:.95rem;color:var(--chalk-dim)}
figcaption b{color:var(--chalk);font-weight:900}

.grownups{margin-top:1.5rem;border-left:3px solid var(--chalk-faint);padding:.2rem 0 .2rem 1rem;font-size:.95rem;color:var(--chalk-dim)}
.grownups summary{cursor:pointer;font-weight:900;color:var(--chalk);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;list-style:none;display:flex;align-items:center;gap:.55rem}
.grownups summary::-webkit-details-marker{display:none}
.grownups summary::before{content:"+";font-family:var(--display);font-size:1.5rem;line-height:1;color:var(--yellow)}
.grownups[open] summary::before{content:"–"}
.grownups p{margin-top:.6rem;max-width:62ch}

.trail{position:fixed;left:1rem;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:.6rem;margin:0;padding:0;list-style:none}
.trail a{display:block;width:11px;height:11px;border-radius:50%;border:2px solid var(--chalk-faint);position:relative;transition:background .2s,border-color .2s}
.trail a.is-active{background:var(--yellow);border-color:var(--yellow)}
.trail a span{position:absolute;left:22px;top:50%;transform:translateY(-50%);white-space:nowrap;font:700 .8rem var(--body);color:var(--chalk);opacity:0;pointer-events:none;transition:opacity .15s;background:var(--board-3);padding:.2rem .55rem;border-radius:4px}
.trail a:hover span,.trail a:focus-visible span{opacity:1}
@media (max-width:1320px){.trail{display:none}}

.forces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;position:relative;margin-top:1.5rem}
.force{border:2px solid var(--chalk-faint);border-radius:12px;padding:1.1rem 1.1rem 1.2rem;background:var(--board-2);transition:transform .8s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;gap:.45rem;position:relative}
.force h3{font-size:1.9rem}
.force p{font-size:.92rem;color:var(--chalk-dim)}
.force .tag{font-size:.7rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--green)}
.force .tag.later{color:var(--pink)}
.force svg{width:60px;height:60px;display:block}
.forces.united .force[data-f="em"]{transform:translateX(calc(100% + 1rem)) rotate(-4deg)}
.forces.united .force[data-f="strong"]{transform:translateX(calc(-100% - 1rem)) rotate(4deg)}
.forces.united .force[data-f="weak"]{transform:scale(1.03)}
.forces.united .force[data-f="gravity"]{animation:wobble 1.3s ease-in-out 1}
.united-label{position:absolute;left:0;right:0;bottom:-2.6rem;text-align:center;font-family:var(--display);font-size:1.7rem;color:var(--yellow);opacity:0;transition:opacity .5s .5s;pointer-events:none}
.forces.united .united-label{opacity:1}
@keyframes wobble{0%,100%{transform:rotate(0)}20%{transform:rotate(-3deg)}40%{transform:rotate(3deg)}60%{transform:rotate(-2deg)}80%{transform:rotate(2deg)}}
@media (max-width:760px){
  .forces{grid-template-columns:repeat(2,minmax(0,1fr))}
  .forces.united .force[data-f="em"]{transform:translate(calc(-100% - 1rem),calc(100% + 1rem)) rotate(-4deg)}
  .forces.united .force[data-f="strong"]{transform:translateX(calc(-100% - 1rem)) rotate(4deg)}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.force{transition:none}.forces.united .force[data-f="gravity"]{animation:none}}

.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2.5rem;margin-top:2.5rem;align-items:start}
.timeline{list-style:none;margin:.5rem 0 0;padding:0}
.timeline li{display:grid;grid-template-columns:5.2rem 1fr;gap:1rem;align-items:baseline;padding:.5rem 0;border-bottom:1px dashed var(--chalk-line)}
.timeline .year{font-family:var(--display);font-size:1.6rem;font-weight:700;color:var(--yellow);font-variant-numeric:tabular-nums}
.timeline .what{font-size:.95rem}
.timeline .what b{font-weight:900}

.checks{list-style:none;padding:0;margin:1rem 0 0;display:grid;gap:.85rem}
.checks li{display:grid;grid-template-columns:2rem 1fr;gap:.8rem;align-items:start}
.checks .box{width:1.55rem;height:1.55rem;border:2px solid var(--chalk-dim);border-radius:5px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;line-height:1;margin-top:.1rem}
.checks .box.ok{color:var(--green)}.checks .box.q{color:var(--yellow)}
.checks small{display:block;color:var(--chalk-dim);font-size:.9rem}

.note{border:2px dashed var(--chalk-faint);border-radius:12px;padding:1.2rem 1.3rem;margin-top:1.8rem;font-size:.97rem}
.note h3{font-size:1.6rem;margin-bottom:.4rem}
.note ul{margin:.4rem 0 0;padding-left:1.2rem}
.note li+li{margin-top:.35rem}

.closing{text-align:center;padding:clamp(3rem,7vw,6rem) 0 3rem;border-top:1px solid var(--chalk-line)}
.closing p{max-width:52ch;margin:1rem auto 0;font-size:1.15rem}
.closing .big{font-family:var(--display);font-size:clamp(2.2rem,5vw,3.6rem);line-height:1.1;color:var(--yellow);max-width:20ch;margin-top:1.5rem}
.tray{height:20px;background:linear-gradient(var(--tray),var(--tray-2));border-top:2px solid rgba(255,255,255,.14);position:relative;z-index:1}
.tray::before,.tray::after{content:"";position:absolute;top:-8px;height:8px;width:54px;border-radius:3px;background:var(--chalk);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.tray::before{left:12%}
.tray::after{left:calc(12% + 70px);width:38px;background:var(--pink)}

.levels{position:sticky;top:0;z-index:6;background:rgba(27,41,35,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--chalk-line)}
.levels-in{display:flex;align-items:center;gap:1rem;padding-top:.5rem;padding-bottom:.5rem}
.levels-label{font-family:var(--display);font-size:1.4rem;color:var(--chalk-dim);white-space:nowrap}
.levels-btns{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none;padding:3px}
.levels-btns::-webkit-scrollbar{display:none}
.levels-btns button{font:900 .82rem/1.1 var(--body);letter-spacing:.04em;color:var(--chalk);background:transparent;border:2px solid var(--chalk-faint);border-radius:999px;padding:.4rem .9rem;cursor:pointer;white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:.12rem;transition:background .15s,color .15s,border-color .15s}
.levels-btns button small{font-weight:700;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;opacity:.72}
.levels-btns button:hover{border-color:var(--chalk)}
.levels-btns button[aria-selected="true"]{background:var(--yellow);color:var(--board);border-color:var(--yellow)}
@media (max-width:560px){.levels-label{display:none}}
.lv{display:none}
html:not([data-level]) .lv-k5,html[data-level="k5"] .lv-k5,html[data-level="g8"] .lv-g8,html[data-level="hs"] .lv-hs,html[data-level="col"] .lv-col,html[data-level="max"] .lv-max{display:block}
.eq{font-family:Georgia,'Times New Roman',serif;font-style:italic;white-space:nowrap;color:var(--yellow)}
.text sub,.text sup{font-size:.72em;line-height:0}
.chapter,.hero{scroll-margin-top:4.6rem}
.note p+p{margin-top:0}
[hidden]{display:none!important}

.labs{display:grid;gap:2.4rem}
.missions{list-style:none;margin:.1rem 0 0;padding:.7rem .95rem .8rem;border:2px dashed var(--chalk-faint);border-radius:10px;display:grid;gap:.45rem}
.missions .mh{font-weight:900;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.missions li.m{display:grid;grid-template-columns:1.45rem 1fr;gap:.6rem;align-items:start;font-size:.95rem}
.missions .box{width:1.35rem;height:1.35rem;border:2px solid var(--chalk-dim);border-radius:4px;display:grid;place-items:center;font-family:var(--display);font-size:1.3rem;line-height:1;color:transparent;margin-top:.05rem}
.missions li.done .box{color:var(--green);border-color:var(--green)}
.missions li.done span:last-child{color:var(--chalk-dim)}
.missions li.just .box{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.7) rotate(-8deg)}100%{transform:scale(1)}}
.mcount{margin-left:auto;font-family:var(--display);font-size:1.35rem;color:var(--yellow);white-space:nowrap}
.btn.read{display:inline-flex;align-items:center;gap:.45rem;margin:.1rem 0 1rem;padding:.5rem .9rem;font-size:.8rem}
.btn.read svg{width:16px;height:16px}
.lv.reading{border-left:3px solid var(--yellow);padding-left:.9rem;margin-left:-1.1rem}
.teach{margin-top:2.2rem;font-size:1rem}
@media (prefers-reduced-motion:reduce){.missions li.just .box{animation:none}}
.panel canvas.short{aspect-ratio:16/9}
.home{font:900 .74rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);text-decoration:none;white-space:nowrap;padding-right:.9rem;border-right:1px solid var(--chalk-line)}
.home:hover{color:var(--yellow)}

.home{font:900 .74rem var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);text-decoration:none;white-space:nowrap;padding-right:.9rem;border-right:1px solid var(--chalk-line)}
.home:hover{color:var(--yellow)}
.keys{display:flex;flex-wrap:wrap;gap:.3rem}
.key{width:2.15rem;height:2.15rem;border:2px solid var(--chalk-faint);border-radius:6px;background:transparent;color:var(--chalk);font:900 .9rem var(--body);cursor:pointer}
.key:hover{background:var(--chalk);color:var(--board)}
.controls .lbl{font-weight:900;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}
input[type=number]{background:transparent;color:var(--chalk);border:2px solid var(--chalk-faint);border-radius:8px;padding:.4rem .5rem;font:700 .95rem var(--body)}
.hero-art{padding:1.2rem}
.hero-art svg{width:100%;height:auto;display:block}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1.4rem;margin-top:2.2rem}
.card{display:flex;flex-direction:column;gap:.6rem;border:2px solid var(--chalk-faint);border-radius:14px;padding:1.4rem 1.4rem 1.5rem;background:var(--board-2);text-decoration:none;color:var(--chalk);transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--yellow)}
.card svg{width:72px;height:72px;display:block}
.card h2{font-size:2.2rem;color:var(--chalk)}
.card .subj{font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.card p{color:var(--chalk-dim);font-size:.98rem}
.card .meta{margin-top:auto;font-family:var(--display);font-size:1.2rem;color:var(--chalk-dim)}
.card .go{font-weight:900;font-size:.85rem;letter-spacing:.05em;color:var(--yellow)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.6rem;margin-top:3.5rem;padding-top:2.2rem;border-top:1px solid var(--chalk-line)}
.how h3{font-size:1.7rem;margin-bottom:.3rem}
.how p{color:var(--chalk-dim);font-size:.97rem}
.next{margin-top:3rem;padding:1.2rem 1.4rem;border:2px dashed var(--chalk-faint);border-radius:12px;color:var(--chalk-dim);font-size:.97rem}
.next b{color:var(--chalk)}
.check{margin-top:.1rem;padding:.8rem 1rem .9rem;border:2px solid var(--chalk-faint);border-radius:10px;display:grid;gap:.5rem}
.check .mh{font-weight:900;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0}
.check .q{font-weight:700;margin-bottom:.5rem}
.cf{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.cf input{width:7.5rem;background:transparent;color:var(--chalk);border:2px solid var(--chalk-faint);border-radius:8px;padding:.45rem .6rem;font:700 1rem var(--body)}
.cf select,.controls select{background:var(--board-2);color:var(--chalk);border:2px solid var(--chalk-faint);border-radius:8px;padding:.45rem .5rem;font:700 .9rem var(--body)}
.fb{margin:0;font-size:.95rem;min-height:1.2em}
.fb.ok{color:var(--green)}.fb.bad{color:var(--pink)}
.warmup{margin:0 0 1.1rem;padding:.6rem .9rem;border-left:3px solid var(--blue);font-size:.98rem}
.warmup b{color:var(--blue);font-weight:900;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:.15rem}
.lesson-end{display:grid;gap:.6rem;padding:.9rem 1rem 1rem;border:2px solid var(--chalk-faint);border-top:3px solid var(--green);border-radius:10px}
.lesson-end p{margin:0}
.lesson-end .skill b{color:var(--green)}
.lesson-end .exit b{color:var(--yellow);font-weight:900;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;display:block;margin-bottom:.1rem}
.discuss summary{cursor:pointer;font-weight:900;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);list-style:none}
.discuss summary::-webkit-details-marker{display:none}
.discuss summary::before{content:"+ ";color:var(--yellow)}
.discuss[open] summary::before{content:"– "}
.discuss ol{margin:.5rem 0 0;padding-left:1.3rem;display:grid;gap:.35rem;font-size:.95rem}
.discuss ol.lv{display:none}
html:not([data-level]) .discuss ol.lv-k5,html[data-level="k5"] .discuss ol.lv-k5,html[data-level="g8"] .discuss ol.lv-g8,html[data-level="hs"] .discuss ol.lv-hs,html[data-level="col"] .discuss ol.lv-col,html[data-level="max"] .discuss ol.lv-max{display:grid}
.links{font-size:.9rem;color:var(--chalk-dim)}
.links a{color:var(--yellow)}
.unitbadge{display:inline-block;font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--board);background:var(--green);border-radius:999px;padding:.18rem .6rem;margin:0 .35rem .3rem 0}
.cf.choice{flex-direction:column;align-items:flex-start;gap:.35rem}
.cf label.opt{display:flex;gap:.55rem;align-items:center;font-weight:700;font-size:.95rem;cursor:pointer}
.cf input[type=radio]{accent-color:var(--yellow);width:1.1rem;height:1.1rem;margin:0}
.grade{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-top:1.3rem}
.grade .lbl,.mapbar .lbl{font-weight:900;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);margin-right:.3rem}
.grade .hint{font-size:1.05rem}
.mapwrap{margin-top:1.6rem;border:2px solid var(--chalk-faint);border-radius:14px;padding:1rem 1rem .6rem;background:var(--board-2)}
.mapbar{display:flex;flex-wrap:wrap;gap:.45rem;align-items:center;margin-bottom:.6rem}
.mapbar .hint{font-family:var(--body);font-size:.88rem;color:var(--chalk-dim)}
.map{position:relative}
.map canvas{display:block;width:100%;height:auto;cursor:pointer}
.tip{position:absolute;pointer-events:none;background:var(--board);border:2px solid var(--chalk-faint);border-radius:8px;padding:.5rem .75rem;font-size:.85rem;max-width:300px;display:none;z-index:2;color:var(--chalk)}
.tip b{display:block;font-family:var(--display);font-size:1.25rem;color:var(--yellow);line-height:1.1}
.tip small{color:var(--chalk-dim)}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1.2rem;margin-top:1.4rem}
.unit{border:2px solid var(--chalk-faint);border-radius:12px;padding:1rem 1.1rem 1.2rem}
.unit h3{font-size:1.8rem}
.unit p{color:var(--chalk-dim);font-size:.95rem;margin:.3rem 0 .7rem}
.unit ol{margin:0;padding-left:1.3rem;display:grid;gap:.3rem;font-size:.95rem}
.unit ol a{color:var(--chalk);text-decoration:none;border-bottom:1px dotted var(--chalk-faint)}
.unit ol a:hover{color:var(--yellow)}
.unit ol small{color:var(--chalk-dim);display:block}
.qsearch{margin-top:2.8rem}
.qsearch input{width:100%;max-width:520px;background:transparent;color:var(--chalk);border:2px solid var(--chalk-faint);border-radius:999px;padding:.6rem 1rem;font:700 1rem var(--body);margin-top:.6rem}
.qlist{list-style:none;padding:0;margin:.9rem 0 0;display:grid;gap:.35rem;max-height:18rem;overflow:auto}
.qlist a{color:var(--chalk);text-decoration:none}
.qlist a:hover{color:var(--yellow)}
.qlist small{color:var(--chalk-dim);margin-left:.45rem}

.links.std{font-size:.82rem}.links.std b{color:var(--chalk-dim);font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:.68rem;margin-right:.3rem}
.baselist{list-style:none;margin:1.2rem 0 0;padding:0;display:grid;gap:.4rem}
.baselist li{display:grid;grid-template-columns:4.2rem 1fr;gap:.2rem .8rem;align-items:baseline;padding:.55rem .2rem;border-bottom:1px dashed var(--chalk-line)}
.baselist .pill{font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.2rem .5rem;text-align:center;color:var(--board);background:var(--chalk-dim)}
.baselist li.built .pill{background:var(--green)}
.baselist a,.baselist b{font-family:var(--display);font-size:1.45rem;font-weight:700;color:var(--chalk);text-decoration:none}
.baselist a{color:var(--yellow)}
.baselist .what{grid-column:2;color:var(--chalk-dim);font-size:.92rem}
.baselist .ngss{grid-column:2;font-size:.78rem;color:var(--chalk-dim);letter-spacing:.04em}
@media (min-width:700px){.baselist li{grid-template-columns:4.2rem 14rem 1fr 14rem}.baselist .what,.baselist .ngss{grid-column:auto}}

.hub-hero{grid-template-columns:1fr;padding-bottom:1.2rem}
.hub-hero .text{max-width:64ch}
.hub-hero .lede{max-width:56ch}
.cards{margin-top:1.6rem}
.card{position:relative;padding-top:1.6rem}
.card .badge{position:absolute;top:-.8rem;left:1.2rem;font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--board);background:var(--green);border-radius:999px;padding:.25rem .7rem}
.card p{min-height:3.2em}
.how{margin-top:3.2rem}
.teachers{margin-top:3rem;padding:1.3rem 1.5rem;border:2px dashed var(--chalk-faint);border-radius:14px;display:grid;gap:.4rem;max-width:72ch}
.teachers p{color:var(--chalk-dim);font-size:1rem;margin:0}
.teachers a{color:var(--yellow);font-weight:700}
.hub-hero .eyebrow .home{border:none;padding:0}

.handin{margin-top:.2rem;padding:.9rem 1rem 1rem;border:2px solid var(--chalk-faint);border-top:3px solid var(--blue);border-radius:10px;display:grid;gap:.55rem}
.handin .mh{font-weight:900;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);margin:0}
.handin p{margin:0;font-size:.95rem;color:var(--chalk-dim)}
.handin .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.handin input,.handin textarea{background:transparent;color:var(--chalk);border:2px solid var(--chalk-faint);border-radius:8px;padding:.5rem .65rem;font:700 .95rem var(--body);width:100%}
.handin input{max-width:16rem}
.handin textarea{min-height:3.6rem;resize:vertical}
.receipt{margin:0;white-space:pre-wrap;font:700 .85rem/1.5 "JetBrains Mono",Menlo,Consolas,monospace;background:rgba(0,0,0,.25);border:1px dashed var(--chalk-faint);border-radius:8px;padding:.8rem .9rem;color:var(--chalk)}
@media print{
  body.print-receipt *{visibility:hidden}
  body.print-receipt .receipt.printing,body.print-receipt .receipt.printing *{visibility:visible}
  body.print-receipt .receipt.printing{position:fixed;left:0;top:0;width:100%;color:#000;background:#fff;border:1px solid #000;font-size:12pt}
}

.picker{display:flex;flex-wrap:wrap;gap:.7rem 1rem;align-items:center;margin-top:1.4rem}
.lcard{margin-top:1.8rem;border:2px solid var(--chalk-faint);border-radius:14px;padding:1.4rem 1.6rem 1.6rem;display:grid;gap:1rem;max-width:80ch}
.lcard header h2{font-size:2.4rem}
.lcard .meta{color:var(--chalk-dim);font-size:.9rem}
.lcard section h3{font-size:1.45rem;margin-bottom:.2rem}
.lcard section h3 small{font-family:var(--body);font-weight:900;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--chalk-dim);margin-left:.5rem}
.lcard p{margin:0;font-size:.98rem}
.lcard .q{font-weight:700}
.lcard .key{font-size:.92rem;color:var(--chalk-dim);margin-top:.25rem}
.lcard .key b{color:var(--green)}
.lcard .opts{margin:.3rem 0 0;padding-left:1.3rem}
.lcard .opts .right{color:var(--green);font-weight:700}
.lcard .ms{list-style:none;padding:0;margin:.2rem 0 0;display:grid;gap:.35rem}
.lcard .ms li{display:flex;gap:.6rem;align-items:center;font-size:.95rem}
.lcard .ms .box{width:1.05rem;height:1.05rem;border:2px solid var(--chalk-dim);border-radius:3px;flex:none}
.lcard .pill{font-size:.62rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:.15rem .5rem;color:var(--board);background:var(--green)}
.lcard .pill.try{background:var(--yellow)}
.lcard .sl{font-size:.88rem;word-break:break-all}
.lcard ol{margin:.3rem 0 0;padding-left:1.3rem;display:grid;gap:.3rem}
.lcard .skill{font-size:.92rem;color:var(--chalk-dim)}
.verify{margin-top:3rem;display:grid;gap:.7rem;max-width:80ch}
.verify textarea{width:100%;background:transparent;color:var(--chalk);border:2px solid var(--chalk-faint);border-radius:10px;padding:.7rem .8rem;font:700 .88rem/1.5 "JetBrains Mono",Menlo,Consolas,monospace}
@media print{
  .picker,.verify,.grade,.tray,.closing,.hub-hero .eyebrow{display:none!important}
  body{background:#fff;color:#111}
  :root{--chalk:#111;--chalk-dim:#444;--chalk-faint:#999;--yellow:#7a5a00;--green:#2b6b2b;--board:#fff}
  .lcard{page-break-after:always;border-color:#999;max-width:none}
  .lcard a{color:#111}
}

@media (max-width:520px){
  .slider input[type=range]{width:110px}
  .levels-in{gap:.5rem}
  .home{padding-right:.5rem;font-size:.64rem}
  .mcount{font-size:1.05rem}
  .lcard{padding:1rem 1rem 1.2rem}
  .picker{gap:.5rem .7rem}
  .picker select{max-width:58vw}
  .hero-cta .hint{display:none}
  .card p{min-height:0}
  .unit,.teachers{padding:1rem}
}

.lowpow{font:900 .66rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--chalk-dim);background:transparent;border:2px solid var(--chalk-faint);border-radius:999px;padding:.35rem .6rem;cursor:pointer;white-space:nowrap}
.lowpow.is-on{background:var(--green);color:var(--board);border-color:var(--green)}
@media (max-width:640px){.lowpow{display:none}}
.rowrap{overflow-x:auto;margin-top:.6rem}
.roster{border-collapse:collapse;font-size:.88rem;min-width:100%}
.roster th,.roster td{border:1px solid var(--chalk-line);padding:.4rem .6rem;text-align:left;white-space:nowrap}
.roster thead th{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--chalk-dim)}
.roster td.good{color:var(--green);font-weight:700}.roster td.part{color:var(--yellow)}.roster td.bad{color:var(--pink)}.roster td.empty{color:var(--chalk-faint)}
.verify .small{font-size:.85rem;color:var(--chalk-dim)}

.cert{margin:2.2rem auto 0;max-width:60ch;padding:1.2rem 1.4rem;border:2px solid var(--green);border-radius:14px;display:grid;gap:.6rem;text-align:center}
.cert .mh{font-weight:900;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0}
.cert p{margin:0;font-size:1rem}
.certout{border:3px double var(--chalk);border-radius:12px;padding:1.4rem 1.2rem;display:grid;gap:.4rem}
.certout .c-eyebrow{font-weight:900;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--chalk-dim)}
.certout .c-name{font-family:var(--display);font-size:2.6rem;color:var(--yellow);line-height:1.05}
.certout .c-what{font-size:1.05rem}
.certout .c-meta{font-size:.8rem;color:var(--chalk-dim)}
@media print{body.print-receipt .certout.printing{visibility:visible;position:fixed;left:5%;top:15%;width:90%;color:#000;background:#fff;border:3px double #000;padding:2rem}body.print-receipt .certout.printing *{visibility:visible;color:#000}}
.kits{display:grid;gap:2.2rem;margin-top:1.4rem}
.kitboard h2{font-size:2.2rem;margin-bottom:.4rem}
.kitboard .sub{color:var(--chalk-dim);font-size:.95rem;margin-bottom:.8rem}
.kitgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem}
.kit{border:2px solid var(--chalk-faint);border-radius:12px;padding:1rem 1.1rem 1.1rem;display:grid;gap:.5rem;align-content:start}
.kit h3{font-size:1.6rem}
.kit .pair{font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--yellow)}
.kit .pair a{color:var(--yellow);text-decoration:none}
.kit p{margin:0;font-size:.93rem}
.kit ol{margin:0;padding-left:1.2rem;display:grid;gap:.25rem;font-size:.93rem}
.kit .notice{color:var(--chalk-dim);border-left:3px solid var(--green);padding-left:.7rem}
.kit .mat b,.kit .notice b{color:var(--chalk)}
@media print{.kit{page-break-inside:avoid}}
.qa table{border-collapse:collapse;margin-top:1rem;font-size:.9rem}
.qa th,.qa td{border:1px solid var(--chalk-line);padding:.4rem .7rem;text-align:left}
.qa .ok{color:var(--green);font-weight:700}.qa .fail{color:var(--pink);font-weight:700}
.qa iframe{width:1px;height:1px;opacity:0;position:absolute;left:-9999px}
</style>
</head>
<body>

<div class="wrap qa" id="top">
<header class="hero hub-hero"><div class="text"><p class="eyebrow"><a class="home" href="https://thedimension5.github.io/chalkboard/boards/">The Chalkboard</a></p><h1>Self-test</h1><p class="lede">Loads every board in the background, steps every simulation 600 times, and checks that every canvas painted, no script error fired, missions rendered, and the level switch works. Run it after any change.</p><div class="row"><button class="btn primary" id="qa-go">Run the self-test</button></div></div></header>
<main><table id="qa-table"><thead><tr><th>Board</th><th>Canvases</th><th>Painted</th><th>Missions</th><th>Levels</th><th>Errors</th><th>Result</th></tr></thead><tbody id="qa-body"></tbody></table><div id="qa-frames"></div></main>
</div>
<script>
const BOARDS=[{"id": "einstein", "url": "https://thedimension5.github.io/chalkboard/einstein/"}, {"id": "electricity", "url": "https://thedimension5.github.io/chalkboard/electricity/"}, {"id": "infinity", "url": "https://thedimension5.github.io/chalkboard/infinity/"}, {"id": "launch", "url": "https://thedimension5.github.io/chalkboard/launch/"}, {"id": "heat", "url": "https://thedimension5.github.io/chalkboard/heat/"}, {"id": "history", "url": "https://thedimension5.github.io/chalkboard/history/"}, {"id": "life", "url": "https://thedimension5.github.io/chalkboard/life/"}];
const $=id=>document.getElementById(id);
function painted(doc){const cs=[...doc.querySelectorAll('canvas')];let n=0;for(const c of cs){try{const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;let k=0;for(let i=3;i<d.length;i+=40)if(d[i]>0){k++;break}if(k)n++}catch(e){}}return[n,cs.length]}
async function testBoard(b){const tr=document.createElement('tr');tr.innerHTML=`<td>${b.id}</td><td colspan="6">loading…</td>`;$('qa-body').appendChild(tr);
  const f=document.createElement('iframe');f.src=b.url+'?level=hs';$('qa-frames').appendChild(f);const errs=[];
  await new Promise(r=>{f.onload=r;setTimeout(r,15000)});const w=f.contentWindow,doc=f.contentDocument;try{w.addEventListener('error',e=>errs.push(String(e.message)))}catch(e){}
  await new Promise(r=>setTimeout(r,800));let ticked=0;try{doc.querySelectorAll('.chapter').forEach(s=>s.scrollIntoView());for(let i=0;i<600;i++){w.Chalk.tick(1/60);ticked++}}catch(e){errs.push('tick: '+e.message)}
  let lv='?';try{doc.querySelector('.levels-btns [data-level="k5"]').click();await new Promise(r=>setTimeout(r,200));lv=doc.documentElement.dataset.level==='k5'?'ok':'stuck'}catch(e){lv='no bar'}
  const [p,n]=painted(doc);const ms=doc.querySelectorAll('.missions li.m').length;const ok=errs.length===0&&p===n&&n>0&&ms>0&&lv==='ok';
  tr.innerHTML=`<td>${b.id}</td><td>${n}</td><td>${p}/${n}</td><td>${ms}</td><td>${lv}</td><td>${errs.length?errs.join('; ').slice(0,120):'none'}</td><td class="${ok?'ok':'fail'}">${ok?'PASS':'FAIL'}</td>`;f.remove()}
$('qa-go').addEventListener('click',async()=>{$('qa-body').innerHTML='';for(const b of BOARDS)await testBoard(b)});
</script>
<script>if("serviceWorker" in navigator&&location.hostname.endsWith("github.io")){addEventListener("load",()=>navigator.serviceWorker.register("https://thedimension5.github.io/chalkboard/sw.js").catch(()=>{}))}</script>
</body>
</html>
